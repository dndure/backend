<!DOCTYPE html>
<html>
<head><title>Sign Up</title></head>
<body>
    <h2>Sign Up</h2>
    {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
    {% if success %}<p style="color:green;">{{ success }}</p>{% endif %}
    <form method="post" class="mt-6">
    {% csrf_token %}
    {% if error %}<p class="text-red-600 mb-4">{{ error }}</p>{% endif %}
    {% if success %}<p class="text-green-600 mb-4">{{ success }}</p>{% endif %}
    <div class="mb-4">
        <input type="text" name="username" placeholder="Username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-clifford" required>
    </div>
    <div class="mb-4">
        <input type="email" name="email" placeholder="Email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-clifford" required>
    </div>
    <div class="mb-4">
        <input type="password" name="password" placeholder="Password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-clifford" required>
    </div>
    <div class="mb-4">
        <input type="password" name="repeatPassword" placeholder="Confirm Password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-clifford" required>
    </div>
    <button type="submit" class="w-full bg-clifford text-white py-2 rounded-lg hover:bg-red-700 transition duration-300">Sign Up</button>
</form>
    <p>Already have an account? <a href="/login/">Log in</a></p>
</body>
</html>
