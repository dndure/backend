<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-clifford: #da373d;
      }
    </style>
    <title>Sign Up</title>
</head>
<body class="flex flex-col min-h-screen bg-gray-100 font-sans antialiased">

    <!-- Navbar -->
    <nav class="bg-clifford text-white p-4 flex justify-between">
        <div class="container mx-auto">
            <h1 class="text-3xl font-bold">AI Blog Generator</h1>
        </div>
        <div>
            <a href="blog/login/" class="text-white hover:underline">Login</a> 
            <a href="blog/signup/" class="text-white hover:underline">SignUp</a>
        </div>
    </nav>

    <! -- Main Content -->
    <div class="container mx-auto flex-grow mt-10 px-4 sm:px-6 lg:px-8">
        <div class="bg-white shadow-md rounded-lg p-6 max-w-3xl mx-auto shadow-md transition duration-300 ease-in-out transform hover:scale-105">
            <!-- Login Section -->
            <div class="text-center py-20">
                <h2 class="text-4xl font-bold mb-4">Sign Up for an Account</h2>
                <p class="text-lg text-gray-600">
                    Please sign up to create an account.
                </p>
                <form class="mt-6" action="/signup/" method="POST">
                    {% csrf_token %}


                    {% if error_message %}
                    <div align="center" class="mb-4" style="color: red;">
                        <h2>
                            {{ error_message }}
                        </h2>
                    </div>
                    {% endif %}
                    <div class="mb-4">
                        <input type="text" placeholder="Username" id="username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-clifford">
                    </div>
                    <div class="mb-4">
                        <input type="email" placeholder="Email" id="email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-clifford">
                    </div>
                    <div class="mb-4">
                        <input type="password" placeholder="Password" id="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-clifford">
                    </div>
                    <div class="mb-4">
                        <input type="password" placeholder="Confirm Password" id="confirm-password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-clifford">
                    </div>
                    <button type="submit" class="w-full bg-clifford text-white py-2 rounded-lg hover:bg-red-700 transition duration-300">Sign Up    </button>
                </form>
            </div>
        </div>
    </div>  

</body>
</html>
